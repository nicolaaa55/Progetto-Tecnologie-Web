<div class="row justify-content-center mt-4">
  <div class="col-md-8">
    <div class="card shadow">
      <div class="card-body">
        <h2 class="text-center mb-4">Wikiblank Game</h2>

        <div
          *ngIf="stato === 'IDLE' || stato === 'WON' || stato === 'ABANDONED'"
          class="text-center mb-4"
        >
          <button class="btn btn-primary btn-lg" (click)="startNewGame()" [disabled]="inAvvio">
            {{
              inAvvio
                ? 'Caricamento...'
                : stato !== 'IDLE'
                  ? 'Gioca Ancora'
                  : 'Inizia Nuova Partita'
            }}
          </button>
        </div>

        <div *ngIf="messaggio" class="alert alert-info text-center" role="alert">
          {{ messaggio }}
        </div>

        <div *ngIf="stato === 'IN_PROGRESS' || stato === 'WON' || stato === 'ABANDONED'">
          <div class="d-flex justify-content-between mb-3 text-muted">
            <span
              >Tentativi falliti/effettuati: <strong>{{ tentativi }}</strong></span
            >
            <span class="badge bg-secondary" *ngIf="stato === 'IN_PROGRESS'">In corso</span>
            <span class="badge bg-success" *ngIf="stato === 'WON'">Vinta!</span>
            <span class="badge bg-secondary" *ngIf="stato === 'ABANDONED'">Abbandonata</span>
          </div>

          <div class="testo-mascherato p-3 bg-light border rounded mb-4">
            {{ testoMascherato }}
          </div>

          <div *ngIf="stato === 'IN_PROGRESS'" class="input-group mb-3">
            <input
              type="text"
              class="form-control"
              name="guessWord"
              placeholder="Inserisci una parola o il nome dell'artista..."
              [(ngModel)]="parolaTentata"
              (keyup.enter)="inviaTentativo()"
            />
            <button class="btn btn-dark" type="button" (click)="inviaTentativo()">Prova</button>
          </div>
          <button
            *ngIf="stato === 'IN_PROGRESS'"
            class="btn btn-outline-danger"
            type="button"
            (mousedown)="abbandonaPartita()"
            [disabled]="inAbbandono"
          >
            {{ inAbbandono ? 'Abbandono...' : 'Abbandona partita' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
